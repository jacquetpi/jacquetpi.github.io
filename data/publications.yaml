# For theses: thesis_type (phd | masters) for bib entry; optional school.
theses:
  - title: "Enhancing IaaS Consolidation with Resource Oversubscription"
    authors: "Pierre Jacquet"
    venue: "Ph.D. Thesis"
    abstract: >-
      By running workloads in shared data centers, the digital realm has improved its energy efficiency, as visible through
      indicators such as Power Usage Efficiency (PUE). However, infrastructure is not the sole point of optimization: from
      both an energy and material standpoint, a server loaded at 100% is preferable to three servers loaded at 30%, making
      usage rates a considerable potential gain for research. This thesis examines these usage rates along four complementary
      contributions: (1) the creation of realistic controlled experiments in an IaaS context, through a dedicated workload
      generation tool; (2) the calculation of individual server oversubscription ratios by considering individual server
      stability, fine-tuning ratios without additional violations; (3) the introduction of a new oversubscription paradigm
      based on the observation that VM vCPUs are not uniformly used, exposing cores of different power levels to improve
      overall performance; (4) the complementarity of oversubscription techniques, since premium and oversubscribed VMs
      saturate their hosts' resources differently, enabling synergies that reduce the number of servers by up to 9.6%.
    thesis_type: "phd"
    school: "Université de Lille"
    year: 2024
    month_num: 7
    bib_key: "phdthesis"
    links:
      - label: "[Thesis]"
        url: "https://theses.fr/2024ULILB015"

  - title: "Mainframe footprint and consumption, an evaluation based on sustainable IT approach"
    authors: "Pierre Jacquet"
    venue: "Master Thesis"
    abstract: >-
      Mainframes remain a key infrastructure element for the banking sector: according to IBM, 92 of the top 100 banks use
      mainframe computers and 90% of all credit card transactions are performed on mainframes. While sustainable IT has been
      extensively studied on common platforms such as x86 computers, there are, to the best of our knowledge, no dedicated
      studies considering the mainframe ecosystem through a consumption prism. We first review consumption evaluation methods
      (hardware, hybrid, and software approaches) and how to adapt them to mainframe specificities. We then determine the
      consumption and carbon footprint of the Groupe BPCE mainframe servers, including external components such as tape
      libraries and flash storage arrays, and compare this order of magnitude against an equivalent x86 architecture. Finally,
      we study how mainframe specificities, including its architecture and retro-compatibility capacity, could support a
      sustainable strategy, and outline directions for such a strategy based on identified internal and external factors.
    thesis_type: "masters"
    school: "Université Paris 12"
    year: 2021
    month_num: 7
    bib_key: "masterthesis"
    links:
      - label: "[Thesis]"
        url: "https://jacquetpi.github.io/pdf/mainframe-consumption.pdf"
